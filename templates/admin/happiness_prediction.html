<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸福感挖掘分析系统</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <style>
        .prediction-container { padding: 20px; background: #f4f7f9; min-height: 100vh; }

        /* --- 赛博能量环样式 (收缩版) --- */
        .cool-result-card {
            background: #ffffff; border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            position: relative; overflow: hidden; border: 1px solid #ebeef5;
            background-image: radial-gradient(rgba(24, 144, 255, 0.05) 1px, transparent 1px), linear-gradient(rgba(24, 144, 255, 0.02) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .energy-ring-wrapper { position: relative; width: 200px; height: 200px; margin: 0 auto 15px; display: flex; justify-content: center; align-items: center; }
        .energy-ring-bg { position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 2px dashed rgba(24, 144, 255, 0.2); animation: rotating 25s linear infinite; }
        .score-number { font-size: 58px; font-weight: 900; background: linear-gradient(135deg, #1890ff 0%, #36cfc9 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 8px 15px rgba(24, 144, 255, 0.15); line-height: 1; z-index: 10; }
        .score-desc-tag { position: absolute; bottom: -5px; width: 70%; left: 15%; text-align: center; font-size: 10px; color: #1890ff; letter-spacing: 2px; font-weight: bold; background: rgba(24, 144, 255, 0.08); padding: 2px 0; border-radius: 4px; }
        @keyframes rotating { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* --- 算法对照与解读区 (收缩间距) --- */
        .mini-card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
        .mini-card { background: #f8f9fb; padding: 12px; border-radius: 12px; border: 1px solid #edf0f5; text-align: center; }
        .mini-score { font-size: 18px; font-weight: bold; color: #303133; }
        .analysis-hint-box { margin-top: 20px; padding: 15px; background: linear-gradient(135deg, rgba(24, 144, 255, 0.03) 0%, rgba(54, 207, 201, 0.06) 100%); border-radius: 12px; border: 1px solid rgba(24, 144, 255, 0.1); font-size: 13px; color: #5c6b77; line-height: 1.5; }

        /* --- 阶层备注：醒目大字号 --- */
        .class-hint { font-size: 14px; color: #606266; margin-top: 12px; padding: 12px; background: #fdf6ec; border-left: 5px solid #e6a23c; border-radius: 4px; font-weight: 500; }

        /* --- 底部图表区域 --- */
        .chart-card { margin-top: 20px; }
        #importanceChart { width: 100%; height: 350px; }
        .el-card { border-radius: 16px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div id="app">
        <admin-layout :active-menu="'happiness_prediction'">
            <template slot="content">
                <div class="prediction-container">
                    <el-row :gutter="25">
                        <el-col :xs="24" :lg="13">
                            <el-card shadow="never">
                                <div slot="header" style="font-weight: bold;"><i class="el-icon-edit"></i> 详细参数录入</div>
                                <el-form :model="predictionForm" label-width="120px" size="small">
                                    <el-form-item label="用户姓名"><el-input v-model="predictionForm.username"></el-input></el-form-item>
                                    <el-form-item label="性别">
                                        <el-radio-group v-model="predictionForm.gender">
                                            <el-radio :label="1">男</el-radio><el-radio :label="2">女</el-radio>
                                        </el-radio-group>
                                    </el-form-item>
                                    <el-form-item label="出生年份"><el-input-number v-model="predictionForm.birth" style="width:100%"></el-input-number></el-form-item>
                                    <el-form-item label="最高学历">
                                        <el-select v-model="predictionForm.edu" style="width:100%">
                                            <el-option label="初中及以下" :value="3"></el-option><el-option label="高中/中专" :value="4"></el-option>
                                            <el-option label="大专" :value="5"></el-option><el-option label="本科" :value="6"></el-option>
                                            <el-option label="研究生及以上" :value="8"></el-option>
                                        </el-select>
                                    </el-form-item>
                                    <el-form-item label="婚姻状况">
                                        <el-select v-model="predictionForm.marital" style="width:100%">
                                            <el-option label="未婚" :value="1"></el-option><el-option label="已婚有配偶" :value="3"></el-option><el-option label="离异/丧偶" :value="5"></el-option>
                                        </el-select>
                                    </el-form-item>

                                    <el-divider content-position="left"><span style="color:#1890ff">经济与生活状况</span></el-divider>
                                    <el-form-item label="个人年收入"><el-input v-model="predictionForm.income" placeholder="元"></el-input></el-form-item>
                                    <el-form-item label="家庭年收入"><el-input v-model="predictionForm.familyIncome" placeholder="元"></el-input></el-form-item>
                                    <el-form-item label="住房面积"><el-input v-model="predictionForm.floorArea" placeholder="㎡"></el-input></el-form-item>
                                    <el-form-item label="拥有汽车">
                                        <el-radio-group v-model="predictionForm.car">
                                            <el-radio :label="1">有</el-radio><el-radio :label="2">无</el-radio>
                                        </el-radio-group>
                                    </el-form-item>

                                    <el-divider content-position="left"><span style="color:#1890ff">主观感知因子</span></el-divider>
                                    <el-form-item label="健康状况">
                                        <el-select v-model="predictionForm.health" style="width:100%">
                                            <el-option label="非常健康" :value="5"></el-option><el-option label="比较健康" :value="4"></el-option>
                                            <el-option label="一般" :value="3"></el-option><el-option label="不健康" :value="1"></el-option>
                                        </el-select>
                                    </el-form-item>
                                    <el-form-item label="心理忧郁感">
                                        <el-select v-model="predictionForm.depression" style="width:100%">
                                            <el-option label="从不" :value="5"></el-option><el-option label="很少" :value="4"></el-option>
                                            <el-option label="有时" :value="3"></el-option><el-option label="总是" :value="1"></el-option>
                                        </el-select>
                                    </el-form-item>
                                    <el-form-item label="社会阶层">
                                        <el-slider v-model="predictionForm.class" :min="1" :max="10" show-input></el-slider>
                                        <div class="class-hint">
                                            <i class="el-icon-warning-outline"></i> <strong>评分参考：</strong> 1代表社会底层，5-6代表中产阶层，10代表社会顶层。
                                        </div>
                                    </el-form-item>

                                    <el-button type="primary" @click="handlePredict" :loading="loading" style="width:100%; height:45px; font-weight:bold; margin-top:10px;">执行深度挖掘报告</el-button>
                                </el-form>
                            </el-card>
                        </el-col>

                        <el-col :xs="24" :lg="11">
                            <div class="cool-result-card" style="min-height: 520px;">
                                <div v-if="predictionResult">
                                    <div style="font-weight: bold; margin-bottom: 15px; color:#303133;"><i class="el-icon-cpu" style="color:#1890ff"></i> 智能挖掘引擎结论</div>
                                    <div class="energy-ring-wrapper">
                                        <div class="energy-ring-bg"></div>
                                        <div id="scoreGauge" style="width:100%; height:100%; position:absolute;"></div>
                                        <div class="score-number">{{predictionResult.hybrid}}</div>
                                        <div class="score-desc-tag">COMPOSITE SCORE</div>
                                    </div>
                                    <div class="mini-card-grid">
                                        <div class="mini-card" style="border-bottom: 3px solid #1890ff;"><div class="mini-label">线性回归预测</div><div class="mini-score">{{predictionResult.lr}}</div></div>
                                        <div class="mini-card" style="border-bottom: 3px solid #67C23A;"><div class="mini-label">随机森林预测</div><div class="mini-score" style="color:#67C23A">{{predictionResult.rf}}</div></div>
                                    </div>
                                    <div class="analysis-hint-box">
                                        <p style="margin: 0;"><i class="el-icon-s-opportunity" style="color:#fadb14"></i> <strong>挖掘结论解读：</strong></p>
                                        <p style="margin-top: 5px;">基于当前样本的 25 维特征，模型判定其幸福感处于 {{predictionResult.hybrid > 3.5 ? '优良' : '一般'}} 状态。核心驱动力主要来源于心理韧性与阶层认同。</p>
                                    </div>
                                </div>
                                <el-empty v-else description="请输入数据并生成结论" style="height:480px"></el-empty>
                            </div>
                        </el-col>
                    </el-row>

                    <el-card shadow="never" class="chart-card">
                        <div slot="header" style="font-weight: bold;"><i class="el-icon-pie-chart" style="color:#1890ff"></i> 核心驱动因子排名 (Top 10)</div>
                        <div id="importanceChart"></div>
                    </el-card>
                </div>
            </template>
        </admin-layout>
    </div>

    <script src="/static/js/vue.js"></script>
    <script src="/static/js/axios.min.js"></script>
    <script src="/static/js/element-ui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="/static/js/config/layout-config.js"></script>
    <script src="/static/js/components/layout.js"></script>

    <script>
        new Vue({
            el: '#app',
            data() {
                return {
                    loading: false,
                    predictionForm: {
                        username: '测试样本', birth: 1995, gender: 1, edu: 6, marital: 3, income: 80000,
                        familyIncome: 120000, floorArea: 100, car: 2, health: 5, depression: 5, equity: 5, class: 5,
                        familyStatus: 3, statusPeer: 3, incAbility: 3, relax: 3, workStatus: 1
                    },
                    predictionResult: null, gaugeChart: null, importanceChart: null
                }
            },
            mounted() { this.$nextTick(() => { this.initMainChart(); }); },
            methods: {
                initMainChart() {
                    this.importanceChart = echarts.init(document.getElementById('importanceChart'));
                    this.loadImportanceData();
                },
                initGaugeChart(val) {
                    const dom = document.getElementById('scoreGauge');
                    if (!dom) return;
                    this.gaugeChart = echarts.init(dom);
                    this.gaugeChart.setOption({
                        series: [{
                            type: 'gauge', min: 1, max: 5, progress: { show: true, width: 10, itemStyle: { color: '#1890ff' } },
                            axisLine: { lineStyle: { width: 10, color: [[1, '#f0f2f5']] } },
                            axisTick: { show: false }, splitLine: { show: false }, axisLabel: { show: false }, pointer: { show: false }, detail: { show: false },
                            data: [{ value: val }]
                        }]
                    });
                },
                loadImportanceData() {
                    axios.get('/api/prediction/model_info').then(res => {
                        const data = res.data.data.importances.slice(0, 10).reverse();
                        this.importanceChart.setOption({
                            tooltip: { trigger: 'axis' },
                            grid: { top: 20, bottom: 20, left: 100, right: 40 },
                            xAxis: { type: 'value', splitLine: { lineStyle: { type: 'dashed' } } },
                            yAxis: { type: 'category', data: data.map(i => i.name) },
                            series: [{
                                type: 'bar', data: data.map(i => i.value),
                                itemStyle: { color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [{ offset: 0, color: '#83bff6' }, { offset: 1, color: '#1890ff' }]), borderRadius: [0, 5, 5, 0] },
                                label: { show: true, position: 'right', formatter: '{c}%' }
                            }]
                        });
                    });
                },
                handlePredict() {
                    this.loading = true;
                    axios.post('/api/prediction/predict', this.predictionForm).then(res => {
                        if (res.data.code === 200) {
                            this.predictionResult = res.data.data;
                            this.$message.success('挖掘计算完成');
                            this.$nextTick(() => { this.initGaugeChart(this.predictionResult.hybrid); });
                        }
                    }).finally(() => { this.loading = false; });
                }
            }
        });
    </script>
</body>
</html>
