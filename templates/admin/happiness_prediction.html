<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸福感挖掘分析系统</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <style>
        .prediction-container { padding: 25px; background: #f0f2f5; min-height: 100vh; font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "微软雅黑", Arial, sans-serif; }
        .full-width-content { width: 100%; max-width: 1100px; margin: 0 auto; }

        /* 卡片风格 */
        .group-card {
            margin-bottom: 20px; border-radius: 12px; border: none;
            box-shadow: 0 2px 12px 0 rgba(0,0,0,0.05); transition: all 0.3s;
        }
        .group-card:hover { box-shadow: 0 4px 16px 0 rgba(0,0,0,0.08); }
        .group-title { font-size: 16px; font-weight: 700; color: #303133; border-left: 5px solid #409EFF; padding-left: 12px; }

        /* 结果展示区 */
        .result-section-card {
            background: #ffffff; border-radius: 16px; padding: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            margin-top: 30px; border: 1px solid #ebeef5;
            position: relative; overflow: hidden;
        }
        .result-section-card::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
        }

        /* ★ 科技感仪表盘容器 ★ */
        .gauge-container {
            position: relative; width: 180px; height: 180px; margin: 0 auto;
            display: flex; justify-content: center; align-items: center;
        }
        #scoreGauge { width: 100%; height: 100%; position: absolute; z-index: 10; }
        .energy-halo {
            position: absolute; width: 100%; height: 100%; border-radius: 50%;
            border: 2px dashed rgba(24, 144, 255, 0.4);
            animation: rotateHalo 12s linear infinite; z-index: 1;
        }
        .energy-halo::before {
            content: ''; position: absolute; top: -8px; left: -8px; right: -8px; bottom: -8px;
            border-radius: 50%; border: 1px solid rgba(0, 242, 254, 0.2);
            animation: rotateHaloReverse 8s linear infinite;
        }
        @keyframes rotateHalo { 100% { transform: rotate(360deg); } }
        @keyframes rotateHaloReverse { 100% { transform: rotate(-360deg); } }
        .score-val {
            position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%);
            font-size: 38px; font-weight: 900;
            background: linear-gradient(90deg, #00f2fe 0%, #1890ff 100%);
            -webkit-background-clip: text; color: transparent;
            z-index: 20; font-family: 'Arial Black', sans-serif;
        }

        /* 仪表盘下方专业的评分量表提示 */
        .score-scale-hint {
            font-size: 12px; color: #909399; background: #f4f4f5; padding: 8px 12px;
            border-radius: 6px; margin-top: 15px; text-align: left; line-height: 1.5; border: 1px dashed #dcdfe6;
        }

        /* ★ 玻璃拟物风多模型对比块 ★ */
        .algo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .algo-cell {
            position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: center;
            background: linear-gradient(145deg, #ffffff, #f5f8ff); border: 1px solid rgba(24,144,255,0.15);
            border-radius: 12px; padding: 15px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); transition: all 0.3s;
        }
        .algo-cell:hover { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(24,144,255,0.15); border-color: rgba(24,144,255,0.4); }
        .algo-cell::after {
            content: ""; position: absolute; top: 0; left: -100%; width: 40%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg); animation: lightSweep 4s infinite;
        }
        @keyframes lightSweep { 0% { left: -100%; } 15% { left: 200%; } 100% { left: 200%; } }

        .algo-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .algo-name { font-size: 14px; color: #606266; font-weight: bold; }
        .algo-num { font-size: 26px; font-weight: 900; font-family: Monaco, monospace; }
        .progress-track { width: 100%; height: 6px; background: #ebeef5; border-radius: 3px; overflow: hidden; }
        .progress-bar { height: 100%; border-radius: 3px; transition: width 1.5s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .bg-green { background: linear-gradient(90deg, #a1c4fd 0%, #67C23A 100%); }
        .bg-orange { background: linear-gradient(90deg, #fdfbfb 0%, #E6A23C 100%); }

        /* AI 解读区域 */
        .ai-note {
            margin-top: 20px; padding: 12px 16px; background: #eef7fe; border-radius: 8px;
            font-size: 13px; color: #506175; line-height: 1.6; border: 1px solid #cce5ff;
        }
        .note-high { background: #f0f9eb; border: 1px solid #c2e7b0; color: #67c23a; }
        .note-mid { background: #ecf5ff; border: 1px solid #ddecff; color: #409eff; }
        .note-low { background: #fdf6ec; border: 1px solid #faecd8; color: #e6a23c; }
    </style>
</head>
<body>
    <div id="app">
        <admin-layout :active-menu="'happiness_prediction'">
            <template slot="content">
                <div class="prediction-container">
                    <div class="full-width-content">

                        <el-form :model="predictionForm" :rules="predictionRules" ref="predictForm" label-position="top" size="medium">
                            <el-card class="group-card">
                                <div slot="header" class="group-title">人口基础画像 (必填)</div>
                                <el-row :gutter="40">
                                    <el-col :span="12"><el-form-item label="1. 性别" prop="gender"><el-select v-model="predictionForm.gender" style="width:100%"><el-option label="男" :value="1"></el-option><el-option label="女" :value="2"></el-option></el-select></el-form-item></el-col>
                                    <el-col :span="12"><el-form-item label="2. 出生年份" prop="birth"><el-input-number v-model="predictionForm.birth" :min="1940" :max="2026" style="width:100%"></el-input-number></el-form-item></el-col>
                                </el-row>
                                <el-row :gutter="40">
                                    <el-col :span="12"><el-form-item label="3. 婚姻状况" prop="marital"><el-select v-model="predictionForm.marital" style="width:100%"><el-option label="未婚" :value="1"></el-option><el-option label="已婚" :value="3"></el-option><el-option label="离异/丧偶" :value="5"></el-option></el-select></el-form-item></el-col>
                                    <el-col :span="12"><el-form-item label="4. 最高学历" prop="edu"><el-select v-model="predictionForm.edu" style="width:100%"><el-option label="初中及以下" :value="3"></el-option><el-option label="高中/中专" :value="4"></el-option><el-option label="本科/大专" :value="6"></el-option><el-option label="研究生及以上" :value="8"></el-option></el-select></el-form-item></el-col>
                                </el-row>
                            </el-card>

                            <el-card class="group-card">
                                <div slot="header" class="group-title">经济与资产实力 (必填)</div>
                                <el-row :gutter="40">
                                    <el-col :span="12"><el-form-item label="5. 个人年收入 (元)" prop="income"><el-input-number v-model="predictionForm.income" :min="0" :step="1000" style="width:100%"></el-input-number></el-form-item></el-col>
                                    <el-col :span="12"><el-form-item label="6. 家庭年收入 (元)" prop="family_income"><el-input-number v-model="predictionForm.family_income" :min="0" :step="1000" style="width:100%"></el-input-number></el-form-item></el-col>
                                </el-row>
                                <el-row :gutter="30">
                                    <el-col :span="8"><el-form-item label="7. 住房面积 (平)" prop="floor_area"><el-input-number v-model="predictionForm.floor_area" :min="0" style="width:100%"></el-input-number></el-form-item></el-col>
                                    <el-col :span="8"><el-form-item label="8. 私家车数量 (辆)" prop="car"><el-input-number v-model="predictionForm.car" :min="0" style="width:100%"></el-input-number></el-form-item></el-col>
                                    <el-col :span="8"><el-form-item label="9. 住房产权" prop="house"><el-select v-model="predictionForm.house" style="width:100%"><el-option label="自有产权" :value="1"></el-option><el-option label="租赁/其他" :value="0"></el-option></el-select></el-form-item></el-col>
                                </el-row>
                            </el-card>

                            <el-card class="group-card">
                                <div slot="header" class="group-title">身心健康自评 (必填)</div>
                                <el-row :gutter="40">
                                    <el-col :span="8"><el-form-item label="10. 生理健康" prop="health"><el-rate v-model="predictionForm.health" show-text :texts="['极差','差','一般','好','极好']"></el-rate></el-form-item></el-col>
                                    <el-col :span="8"><el-form-item label="11. 抑郁频率" prop="depression"><el-rate v-model="predictionForm.depression" show-text :texts="['总是','多','有时','少','从不']"></el-rate></el-form-item></el-col>
                                    <el-col :span="8"><el-form-item label="12. 休闲放松" prop="relax"><el-rate v-model="predictionForm.relax"></el-rate></el-form-item></el-col>
                                </el-row>
                            </el-card>

                            <el-card class="group-card">
                                <div slot="header" class="group-title">社会阶层感知 (必填)</div>
                                <el-row :gutter="40">
                                    <el-col :span="12"><el-form-item label="13. 社会公平感" prop="equity"><el-select v-model="predictionForm.equity" style="width:100%"><el-option label="极不公平" :value="1"></el-option><el-option label="一般" :value="3"></el-option><el-option label="非常公平" :value="5"></el-option></el-select></el-form-item></el-col>
                                    <el-col :span="12"><el-form-item label="14. 主观社会阶层 (拖动选择)" prop="class"><el-slider v-model="predictionForm.class" :min="1" :max="10" show-input></el-slider></el-form-item></el-col>
                                </el-row>
                                <el-form-item label="15. 同龄人地位感知" prop="status_peer"><el-rate v-model="predictionForm.status_peer" :max="5"></el-rate></el-form-item>
                            </el-card>

                            <el-collapse v-model="activeNames" style="margin-bottom: 20px; border-radius: 12px; border: none; box-shadow: 0 2px 12px 0 rgba(0,0,0,0.05); overflow: hidden;">
                                <el-collapse-item name="1">
                                    <template slot="title">
                                        <div style="font-size: 15px; font-weight: 700; color: #909399; padding-left: 15px;">
                                            <i class="el-icon-circle-plus-outline" style="color: #409EFF; margin-right: 5px;"></i> 补充详细特征 (选填 - 展开补充可提升预测精度)
                                        </div>
                                    </template>
                                    <div style="padding: 20px; background: #fafafa;">
                                        <el-row :gutter="40">
                                            <el-col :span="8"><el-form-item label="16. 政治面貌"><el-select v-model="predictionForm.political" style="width:100%"><el-option label="群众" :value="1"></el-option><el-option label="党员" :value="4"></el-option></el-select></el-form-item></el-col>
                                            <el-col :span="8"><el-form-item label="17. 户口性质"><el-select v-model="predictionForm.hukou" style="width:100%"><el-option label="农业户口" :value="1"></el-option><el-option label="非农户口" :value="4"></el-option></el-select></el-form-item></el-col>
                                            <el-col :span="8"><el-form-item label="18. 宗教信仰"><el-select v-model="predictionForm.religion" style="width:100%"><el-option label="无" :value="0"></el-option><el-option label="有" :value="1"></el-option></el-select></el-form-item></el-col>
                                        </el-row>
                                        <el-row :gutter="40">
                                            <el-col :span="8"><el-form-item label="19. 社交频率"><el-rate v-model="predictionForm.socialize"></el-rate></el-form-item></el-col>
                                            <el-col :span="8"><el-form-item label="20. 学习频率"><el-rate v-model="predictionForm.learn"></el-rate></el-form-item></el-col>
                                            <el-col :span="8"><el-form-item label="21. 工作状态"><el-select v-model="predictionForm.work_status" style="width:100%"><el-option label="在业" :value="1"></el-option><el-option label="非在业" :value="0"></el-option></el-select></el-form-item></el-col>
                                        </el-row>
                                        <el-row :gutter="40">
                                            <el-col :span="8"><el-form-item label="22. 家庭社会地位"><el-rate v-model="predictionForm.family_status"></el-rate></el-form-item></el-col>
                                            <el-col :span="8"><el-form-item label="23. 收入相对水平"><el-rate v-model="predictionForm.inc_ability"></el-rate></el-form-item></el-col>
                                            <el-col :span="8"><el-form-item label="24. 社会信任度"><el-rate v-model="predictionForm.trust"></el-rate></el-form-item></el-col>
                                        </el-row>
                                        <el-row :gutter="40">
                                            <el-col :span="6"><el-form-item label="25. 互联网使用"><el-rate v-model="predictionForm.media_internet"></el-rate></el-form-item></el-col>
                                            <el-col :span="6"><el-form-item label="26. 电视观看"><el-rate v-model="predictionForm.media_tv"></el-rate></el-form-item></el-col>
                                            <el-col :span="6"><el-form-item label="27. 身高 (cm)"><el-input-number v-model="predictionForm.height_cm" style="width:100%"></el-input-number></el-form-item></el-col>
                                            <el-col :span="6"><el-form-item label="28. 体重 (斤)"><el-input-number v-model="predictionForm.weight_jin" style="width:100%"></el-input-number></el-form-item></el-col>
                                        </el-row>
                                    </div>
                                </el-collapse-item>
                            </el-collapse>

                            <el-button type="primary" @click="handlePredict" :loading="loading" style="width:100%; height:55px; font-size:18px; font-weight:bold; margin-bottom:20px; border-radius:30px; box-shadow: 0 8px 20px rgba(64, 158, 255, 0.3);">启动在线智能评估</el-button>
                        </el-form>

                        <div v-if="predictionResult" id="result-section" class="result-section-card">
                            <h3 style="margin:0 0 25px 0; font-size:20px; color:#303133; text-align:center;">
                                <i class="el-icon-odometer" style="color:#1890ff; margin-right:8px;"></i> 个体推演诊断结果
                            </h3>

                            <el-row :gutter="40" type="flex" align="middle">
                                <el-col :span="8" style="text-align: center;">
                                    <div class="gauge-container">
                                        <div class="energy-halo"></div>
                                        <div id="scoreGauge"></div>
                                        <div class="score-val" v-text="predictionResult.hybrid.toFixed(2)"></div>
                                    </div>
                                    <div style="font-weight:bold; color:#303133; margin-top:15px; font-size: 16px;">综合幸福感预测指数 (Hybrid)</div>

                                    <div class="score-scale-hint">
                                        <b><i class="el-icon-info"></i> 量表说明：</b><br>
                                        系统采用标准 5 分制算法评估。<br>
                                        • <b>1.0分</b> 代表极低水平/高预警状态<br>
                                        • <b>5.0分</b> 代表极高水平/优质协调状态<br>
                                        分数越高表明幸福感知度及综合抗压能力越优。
                                    </div>
                                </el-col>

                                <el-col :span="16">
                                    <div class="algo-grid">
                                        <div class="algo-cell lr-cell">
                                            <div class="algo-header">
                                                <span class="algo-name"><i class="el-icon-data-line" style="color:#67C23A;"></i> 线性回归推演 (LR)</span>
                                                <span class="algo-num" style="color:#67C23A" v-text="predictionResult.lr.toFixed(2)"></span>
                                            </div>
                                            <div class="progress-track"><div class="progress-bar bg-green" :style="{ width: (predictionResult.lr / 5 * 100) + '%' }"></div></div>
                                        </div>
                                        <div class="algo-cell rf-cell">
                                            <div class="algo-header">
                                                <span class="algo-name"><i class="el-icon-connection" style="color:#E6A23C;"></i> 随机森林推演 (RF)</span>
                                                <span class="algo-num" style="color:#E6A23C" v-text="predictionResult.rf.toFixed(2)"></span>
                                            </div>
                                            <div class="progress-track"><div class="progress-bar bg-orange" :style="{ width: (predictionResult.rf / 5 * 100) + '%' }"></div></div>
                                        </div>
                                    </div>
                                    <div class="ai-note" :class="{'note-high': predictionResult.hybrid >= 4.0, 'note-mid': predictionResult.hybrid >= 3.5 && predictionResult.hybrid < 4.0, 'note-low': predictionResult.hybrid < 3.5}">
                                        <div class="ai-title">
                                            <i :class="predictionResult.hybrid >= 4.0 ? 'el-icon-medal' : (predictionResult.hybrid >= 3.5 ? 'el-icon-sunny' : 'el-icon-warning-outline')"></i>
                                            AI 智能解读报告
                                        </div>
                                        <div v-if="predictionResult.hybrid >= 4.0">
                                            您的幸福感指数属于<strong>“优秀典范”</strong>档位。模型识别出您在心理状态与社会融入度上具有极高的正向协调性，请继续保持积极的生活方式。
                                        </div>
                                        <div v-else-if="predictionResult.hybrid >= 3.5">
                                            您的幸福感处于<strong>“稳步提升”</strong>区间。模型显示您的核心归因因子表现均衡，可在关注自我提升的同时适当减轻内耗压力。
                                        </div>
                                        <div v-else>
                                            您的幸福感指数<strong>“有待改善”</strong>。模型深度推演建议：建议您前往系统侧边栏的【全域数据洞察】模块，参考宏观规律进行心理建设与期望调整。
                                        </div>
                                    </div>
                                </el-col>
                            </el-row>
                        </div>

                    </div>
                </div>
            </template>
        </admin-layout>
    </div>

    <script src="/static/js/vue.js"></script>
    <script src="/static/js/element-ui.min.js"></script>
    <script src="/static/js/axios.min.js"></script>
    <script src="/static/js/echarts.min.js"></script>
    <script src="/static/js/config/layout-config.js"></script>
    <script src="/static/js/components/layout.js"></script>

    <script>
        new Vue({
            el: '#app',
            data() {
                return {
                    loading: false,
                    activeNames: [],
                    predictionForm: {
                        gender: 1, birth: 1995, marital: 3, edu: 6, income: 50000,
                        family_income: 100000, floor_area: 90, car: 0, house: 1,
                        health: 4, depression: 4, relax: 3, equity: 3, class: 5, status_peer: 3,
                        political: 1, hukou: 1, religion: 0, socialize: 3, learn: 2,
                        work_status: 1, family_status: 3, inc_ability: 3, trust: 3,
                        media_internet: 4, media_tv: 3, height_cm: 165, weight_jin: 130
                    },
                    predictionRules: {
                        gender: [{ required: true, message: '请选择性别', trigger: 'change' }],
                        birth: [{ required: true, message: '请输入出生年份', trigger: 'blur' }],
                        marital: [{ required: true, message: '请选择婚姻状况', trigger: 'change' }],
                        edu: [{ required: true, message: '请选择学历', trigger: 'change' }],
                        income: [{ required: true, message: '请输入个人收入', trigger: 'blur' }],
                        family_income: [{ required: true, message: '请输入家庭收入', trigger: 'blur' }],
                        floor_area: [{ required: true, message: '请输入面积', trigger: 'blur' }],
                        car: [{ required: true, message: '请输入数量', trigger: 'blur' }],
                        house: [{ required: true, message: '请选择产权', trigger: 'change' }],
                        health: [{ required: true, message: '请评分', trigger: 'change' }],
                        depression: [{ required: true, message: '请评分', trigger: 'change' }],
                        relax: [{ required: true, message: '请评分', trigger: 'change' }],
                        equity: [{ required: true, message: '请选择', trigger: 'change' }],
                        class: [{ required: true, message: '请选择', trigger: 'change' }],
                        status_peer: [{ required: true, message: '请评分', trigger: 'change' }]
                    },
                    predictionResult: null,
                    gaugeInstance: null
                }
            },
            methods: {
                handlePredict() {
                    this.$refs.predictForm.validate((valid) => {
                        if (valid) {
                            this.loading = true;
                            axios.post('/api/prediction/predict', this.predictionForm).then(res => {
                                if (res.data.code === 200) {
                                    this.predictionResult = res.data.data;
                                    this.$message.success('个体特征分析与模型推演完成');
                                    this.$nextTick(() => {
                                        setTimeout(() => {
                                            document.getElementById('result-section').scrollIntoView({ behavior: 'smooth' });
                                            this.initGaugeChart(this.predictionResult.hybrid);
                                        }, 300);
                                    });
                                }
                            }).finally(() => { this.loading = false; });
                        } else {
                            this.$message.warning('请检查并补全必填的基础特征');
                            return false;
                        }
                    });
                },
                initGaugeChart(val) {
                    const dom = document.getElementById('scoreGauge');
                    if (this.gaugeInstance) this.gaugeInstance.dispose();
                    this.gaugeInstance = echarts.init(dom);
                    this.gaugeInstance.setOption({
                        series: [
                            {
                                type: 'gauge', min: 1, max: 5, startAngle: 220, endAngle: -40, radius: '100%',
                                axisLine: { lineStyle: { width: 2, color: [[1, 'rgba(24, 144, 255, 0.15)']] } },
                                splitLine: { show: true, length: 8, lineStyle: { color: 'rgba(24, 144, 255, 0.5)', width: 1 } },
                                axisTick: { show: false }, axisLabel: { show: false },
                                pointer: { show: false }, detail: { show: false }
                            },
                            {
                                type: 'gauge', min: 1, max: 5, startAngle: 210, endAngle: -30, radius: '85%',
                                progress: {
                                    show: true, width: 14, roundCap: true,
                                    itemStyle: {
                                        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
                                            { offset: 0, color: '#00f2fe' }, { offset: 1, color: '#4facfe' }
                                        ]),
                                        shadowBlur: 10, shadowColor: 'rgba(79, 172, 254, 0.4)'
                                    }
                                },
                                axisLine: { roundCap: true, lineStyle: { width: 14, color: [[1, '#ebf2f5']] } },
                                axisTick: { show: false }, splitLine: { show: false }, axisLabel: { show: false },
                                pointer: { show: false }, detail: { show: false },
                                data: [{ value: val }],
                                animationDuration: 2000, animationEasing: 'cubicOut'
                            }
                        ]
                    });
                }
            }
        });
    </script>
