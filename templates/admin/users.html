<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 幸福感智能分析系统</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
    <div id="app">
        <admin-layout :active-menu="activeMenu">
            <template #content>
                <div class="user-management-container">
                    <el-card class="search-card">
                        <el-form :model="searchForm" :inline="true" class="search-form">
                            <el-form-item label="关键词">
                                <el-input
                                    v-model="searchForm.keyword"
                                    placeholder="用户名/姓名/邮箱"
                                    clearable>
                                </el-input>
                            </el-form-item>
                            <el-form-item label="角色">
                                <el-select v-model="searchForm.role" placeholder="选择角色" clearable>
                                    <el-option label="全部" value=""></el-option>
                                    <el-option
                                        v-for="role in roleOptions"
                                        :key="role.value"
                                        :label="role.label"
                                        :value="role.value">
                                    </el-option>
                                </el-select>
                            </el-form-item>
                            <el-form-item label="状态">
                                <el-select v-model="searchForm.status" placeholder="选择状态" clearable>
                                    <el-option label="全部" value=""></el-option>
                                    <el-option label="正常" value="active"></el-option>
                                    <el-option label="锁定" value="locked"></el-option>
                                    <el-option label="禁用" value="disabled"></el-option>
                                </el-select>
                            </el-form-item>
                            <el-form-item>
                                <el-button type="primary" @click="searchUsers">搜索</el-button>
                                <el-button @click="resetSearch">重置</el-button>
                            </el-form-item>
                        </el-form>
                    </el-card>

                    <el-card class="table-card">
                        <div slot="header" class="card-header">
                            <span>系统用户列表</span>
                            <el-button type="primary" icon="el-icon-plus" @click="showAddDialog">新增用户账号</el-button>
                        </div>

                        <el-table
                            :data="userList"
                            v-loading="tableLoading"
                            stripe
                            style="width: 100%">
                            <el-table-column prop="id" label="ID" width="60"></el-table-column>
                            <el-table-column prop="username" label="用户名" width="120"></el-table-column>
                            <el-table-column prop="nickname" label="真实姓名" width="120"></el-table-column>
                            <el-table-column prop="avatar" label="头像" width="80">
                                <template #default="scope">
                                    <el-avatar :src="scope.row.avatar || '/static/image/profile.png'" size="small"></el-avatar>
                                </template>
                            </el-table-column>
                            <el-table-column prop="email" label="邮箱" min-width="150"></el-table-column>
                            <el-table-column prop="phone" label="手机号" width="120"></el-table-column>
                            <el-table-column prop="role" label="权限角色" width="120">
                                <template #default="scope">
                                    <el-tag
                                        :type="getRoleTagType(scope.row.role)"
                                        size="small" effect="dark">
                                        {{ getRoleText(scope.row.role) }}
                                    </el-tag>
                                </template>
                            </el-table-column>
                            <el-table-column prop="status" label="状态" width="100">
                                <template #default="scope">
                                    <el-tag
                                        :type="getStatusTagType(scope.row.status)"
                                        size="small">
                                        {{ getStatusText(scope.row.status) }}
                                    </el-tag>
                                </template>
                            </el-table-column>
                            <el-table-column prop="last_login_time" label="最后登录" width="160"></el-table-column>
                            <el-table-column label="操作" width="220" fixed="right">
                                <template #default="scope">
                                    <el-button type="text" size="small" icon="el-icon-edit" @click="editUser(scope.row)">编辑</el-button>
                                    <el-button type="text" size="small" icon="el-icon-key" @click="changePassword(scope.row)">改密</el-button>
                                    <el-button type="text" size="small" icon="el-icon-delete" @click="deleteUser(scope.row)" style="color: #f56c6c;">删除</el-button>
                                </template>
                            </el-table-column>
                        </el-table>

                        <div class="pagination-container" style="margin-top: 20px; text-align: right;">
                            <el-pagination
                                @size-change="handleSizeChange"
                                @current-change="handleCurrentChange"
                                :current-page="pagination.pageNum"
                                :page-sizes="[10, 20, 50, 100]"
                                :page-size="pagination.pageSize"
                                layout="total, sizes, prev, pager, next, jumper"
                                :total="pagination.total">
                            </el-pagination>
                        </div>
                    </el-card>
                </div>

                <el-dialog
                    :title="dialogTitle"
                    :visible.sync="dialogVisible"
                    width="45%"
                    @close="resetForm">
                    <el-form :model="userForm" :rules="userRules" ref="userForm" label-width="100px">
                        <el-row :gutter="20">
                            <el-col :span="12">
                                <el-form-item label="用户名" prop="username">
                                    <el-input v-model="userForm.username" :disabled="isEdit" placeholder="用于系统登录"></el-input>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="初始密码" prop="password" v-if="!isEdit">
                                    <el-input v-model="userForm.password" type="password" placeholder="建议不少于6位"></el-input>
                                </el-form-item>
                            </el-col>
                        </el-row>

                        <el-row :gutter="20">
                            <el-col :span="12">
                                <el-form-item label="真实姓名" prop="nickname">
                                    <el-input v-model="userForm.nickname" placeholder="如：张三"></el-input>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="分配角色" prop="role">
                                    <el-select v-model="userForm.role" placeholder="选择系统权限" style="width:100%">
                                        <el-option
                                            v-for="role in roleOptions"
                                            :key="role.value"
                                            :label="role.label"
                                            :value="role.value">
                                        </el-option>
                                    </el-select>
                                </el-form-item>
                            </el-col>
                        </el-row>

                        <el-row :gutter="20">
                            <el-col :span="12">
                                <el-form-item label="状态" prop="status">
                                    <el-select v-model="userForm.status" placeholder="账号状态" style="width:100%">
                                        <el-option label="正常" value="active"></el-option>
                                        <el-option label="锁定" value="locked"></el-option>
                                        <el-option label="禁用" value="disabled"></el-option>
                                    </el-select>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="年龄">
                                    <el-input v-model.number="userForm.age" type="number" placeholder="选填"></el-input>
                                </el-form-item>
                            </el-col>
                        </el-row>

                        <el-collapse style="margin-top: 10px; border:none;">
                            <el-collapse-item title="更多选填信息 (点击展开)" name="1">
                                <div style="padding: 10px 0;">
                                    <el-row :gutter="20">
                                        <el-col :span="12">
                                            <el-form-item label="手机号" prop="phone">
                                                <el-input v-model="userForm.phone" placeholder="选填"></el-input>
                                            </el-form-item>
                                        </el-col>
                                        <el-col :span="12">
                                            <el-form-item label="邮箱" prop="email">
                                                <el-input v-model="userForm.email" placeholder="选填"></el-input>
                                            </el-form-item>
                                        </el-col>
                                    </el-row>
                                    <el-row :gutter="20">
                                        <el-col :span="12">
                                            <el-form-item label="性别">
                                                <el-select v-model="userForm.sex" placeholder="选填" style="width:100%"><el-option label="男" value="男"></el-option><el-option label="女" value="女"></el-option></el-select>
                                            </el-form-item>
                                        </el-col>
                                        <el-col :span="12">
                                            <el-form-item label="职业">
                                                <el-input v-model="userForm.profession" placeholder="选填"></el-input>
                                            </el-form-item>
                                        </el-col>
                                    </el-row>
                                </div>
                            </el-collapse-item>
                        </el-collapse>
                    </el-form>

                    <div class="dialog-footer" style="text-align: right; margin-top: 20px;">
                        <el-button @click="dialogVisible = false">取 消</el-button>
                        <el-button type="primary" @click="saveUser" :loading="saveLoading">确 定 提 交</el-button>
                    </div>
                </el-dialog>

                <el-dialog title="修改系统密码" :visible.sync="passwordDialogVisible" width="400px">
                    <el-form :model="passwordForm" :rules="passwordRules" ref="passwordForm" label-width="100px">
                        <el-form-item label="新密码" prop="newPassword">
                            <el-input v-model="passwordForm.newPassword" type="password"></el-input>
                        </el-form-item>
                        <el-form-item label="确认密码" prop="confirmPassword">
                            <el-input v-model="passwordForm.confirmPassword" type="password"></el-input>
                        </el-form-item>
                    </el-form>
                    <div class="dialog-footer" style="text-align: right; margin-top: 20px;">
                        <el-button @click="passwordDialogVisible = false">取消</el-button>
                        <el-button type="primary" @click="savePassword" :loading="passwordLoading">确认修改</el-button>
                    </div>
                </el-dialog>
            </template>
        </admin-layout>
    </div>

    <script src="/static/js/vue.js"></script>
    <script src="/static/js/element-ui.min.js"></script>
    <script src="/static/js/axios.min.js"></script>
    <script src="/static/js/config/layout-config.js"></script>
    <script src="/static/js/components/layout.js"></script>
    <script>
        new Vue({
            el: '#app',
            data() {
                return {
                    activeMenu: 'users',
                    roleOptions: LayoutConfig.roleOptions,
                    roleMap: this.buildRoleMap(LayoutConfig.roleOptions),
                    searchForm: { keyword: '', role: '', status: '' },
                    userList: [],
                    tableLoading: false,
                    pagination: { pageNum: 1, pageSize: 10, total: 0 },
                    dialogVisible: false, dialogTitle: '新增用户账号', isEdit: false, saveLoading: false,
                    userForm: {
                        username: '', password: '', nickname: '', email: '', phone: '', sex: '', age: '', birthday: '', address: '', education: '', profession: '', company: '', role: '', status: 'active', content: '', remarks: ''
                    },
                    userRules: {
                        username: [
                            { required: true, message: '请输入用户名', trigger: 'blur' },
                            { min: 3, max: 20, message: '长度在 3 到 20 个字符', trigger: 'blur' }
                        ],
                        password: [
                            { required: true, message: '请输入密码', trigger: 'blur' },
                            { min: 6, message: '密码不能少于6位', trigger: 'blur' }
                        ],
                        nickname: [
                            { required: true, message: '真实姓名必填', trigger: 'blur' }
                        ],
                        role: [
                            { required: true, message: '请分配系统角色', trigger: 'change' }
                        ],
                        status: [
                            { required: true, message: '请选择账号状态', trigger: 'change' }
                        ],
                        // ★ 修复点：正则允许为空（^$），但如果填写必须符合格式
                        email: [
                            { pattern: /^$|^([a-zA-Z0-9_-])+@([a-zA-Z0-9_-])+(.[a-zA-Z0-9_-])+/, message: '邮箱格式不正确', trigger: 'blur' }
                        ],
                        phone: [
                            { pattern: /^$|^1[3-9]\d{9}$/, message: '手机号格式不正确', trigger: 'blur' }
                        ]
                    },
                    passwordDialogVisible: false, passwordLoading: false,
                    passwordForm: { userId: null, newPassword: '', confirmPassword: '' },
                    passwordRules: {
                        newPassword: [
                            { required: true, message: '请输入新密码', trigger: 'blur' },
                            { min: 6, message: '密码不能少于6位', trigger: 'blur' }
                        ],
                        confirmPassword: [
                            { required: true, message: '请确认密码', trigger: 'blur' }
                        ]
                    }
                }
            },
            mounted() {
                this.loadUserList();
                this.initPasswordValidation();
            },
            methods: {
                initPasswordValidation() {
                    this.passwordRules.confirmPassword.push({ validator: this.validateConfirmPassword, trigger: 'blur' });
                },
                loadUserList() {
                    this.tableLoading = true;
                    const params = { pageNum: this.pagination.pageNum, pageSize: this.pagination.pageSize, ...this.searchForm };
                    axios.get('/api/user/list', { params }).then(response => {
                        if (response.data.code === 200) {
                            this.userList = response.data.data.rows;
                            this.pagination.total = response.data.data.total;
                        } else {
                            this.$message.error(response.data.message);
                        }
                    }).finally(() => { this.tableLoading = false; });
                },
                searchUsers() { this.pagination.pageNum = 1; this.loadUserList(); },
                resetSearch() { this.searchForm = { keyword: '', role: '', status: '' }; this.pagination.pageNum = 1; this.loadUserList(); },
                handleSizeChange(size) { this.pagination.pageSize = size; this.pagination.pageNum = 1; this.loadUserList(); },
                handleCurrentChange(page) { this.pagination.pageNum = page; this.loadUserList(); },
                showAddDialog() { this.dialogTitle = '新增用户账号'; this.isEdit = false; this.dialogVisible = true; },
                editUser(user) { this.dialogTitle = '编辑用户信息'; this.isEdit = true; this.userForm = { ...user }; this.dialogVisible = true; },

                saveUser() {
                    this.$refs.userForm.validate((valid) => {
                        if (valid) {
                            this.saveLoading = true;

                            // ★ 修复点：数据清洗，防止后端报 500 Integer 错误
                            let submitData = { ...this.userForm };
                            if (submitData.age === '') submitData.age = null;

                            const url = this.isEdit ? `/api/user/${submitData.id}` : '/api/user/add';
                            const method = this.isEdit ? 'put' : 'post';

                            axios[method](url, submitData).then(response => {
                                if (response.data.code === 200) {
                                    this.$message.success('用户保存成功！');
                                    this.dialogVisible = false;
                                    this.loadUserList();
                                } else {
                                    this.$message.error(response.data.message || '保存失败');
                                }
                            }).catch(error => {
                                console.error(error);
                                this.$message.error('网络请求失败，请检查后端是否报错');
                            }).finally(() => { this.saveLoading = false; });
                        } else {
                            this.$message.warning('请检查表单中必填项是否漏填或填错！');
                            return false;
                        }
                    });
                },

                deleteUser(user) {
                    this.$confirm(`确定要删除用户 "${user.nickname || user.username}" 吗？该操作不可逆！`, '危险警告', {
                        confirmButtonText: '确定删除', cancelButtonText: '取消', type: 'error'
                    }).then(() => {
                        axios.delete(`/api/user/${user.id}`).then(response => {
                            if (response.data.code === 200) {
                                this.$message.success('删除成功！');
                                this.loadUserList();
                            } else { this.$message.error(response.data.message); }
                        });
                    });
                },
                changePassword(user) { this.passwordForm.userId = user.id; this.passwordForm.newPassword = ''; this.passwordForm.confirmPassword = ''; this.passwordDialogVisible = true; },
                savePassword() {
                    this.$refs.passwordForm.validate((valid) => {
                        if (valid) {
                            this.passwordLoading = true;
                            axios.post('/api/user/admin/change-user-password', {
                                userId: this.passwordForm.userId, newPassword: this.passwordForm.newPassword
                            }).then(response => {
                                if (response.data.code === 200) {
                                    this.$message.success('密码修改成功');
                                    this.passwordDialogVisible = false;
                                } else { this.$message.error(response.data.message); }
                            }).finally(() => { this.passwordLoading = false; });
                        }
                    });
                },
                validateConfirmPassword(rule, value, callback) {
                    if (value !== this.passwordForm.newPassword) { callback(new Error('两次输入的密码不一致！')); } else { callback(); }
                },
                resetForm() {
                    this.userForm = { username: '', password: '', nickname: '', email: '', phone: '', sex: '', age: '', birthday: '', address: '', education: '', profession: '', company: '', role: '', status: 'active', content: '', remarks: '' };
                    this.$refs.userForm && this.$refs.userForm.resetFields();
                },
                buildRoleMap(options) { const map = {}; options.forEach(option => { map[option.value] = option.label; }); return map; },
                getRoleText(role) { return this.roleMap[role] || role; },
                getRoleTagType(role) { const typeMap = { 'admin': 'danger', 'operation': 'warning', 'user': 'success' }; return typeMap[role] || 'info'; },
                getStatusText(status) { const statusMap = { 'active': '正常', 'locked': '锁定', 'disabled': '禁用' }; return statusMap[status] || status; },
                getStatusTagType(status) { const typeMap = { 'active': 'success', 'locked': 'warning', 'disabled': 'danger' }; return typeMap[status] || 'info'; }
            }
        });
    </script>
</body>
</html>
