<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据分析 - 后台管理系统</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <style>
        .analysis-container { padding: 20px; }
        .analysis-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .chart-container { height: 420px; margin-bottom: 20px; border: 1px solid #e4e7ed; border-radius: 8px; background: white; box-shadow: 0 2px 12px 0 rgba(0,0,0,0.05); }
        .overview-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .overview-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); text-align: center; }
        .overview-card .number { font-size: 32px; font-weight: bold; color: #409EFF; margin-bottom: 8px; }
        .overview-card .label { font-size: 14px; color: #666; }
        .analysis-summary { background: linear-gradient(135deg, #1890ff 0%, #36cfc9 100%); color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
        .summary-number { font-size: 24px; font-weight: bold; display: block; }
        .summary-label { font-size: 14px; opacity: 0.9; }
        .conclusions-section { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); margin-top: 20px; }
        .conclusion-item { margin-bottom: 15px; padding: 15px; border-left: 4px solid #409EFF; background: #f8f9fa; border-radius: 4px; }
        .conclusion-category { font-weight: bold; color: #409EFF; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div id="app">
        <admin-layout :active-menu="activeMenu">
            <template #content>
                <div class="analysis-container">
                    <div class="analysis-header">
                        <h2>幸福感深度挖掘分析 (调试模式)</h2>
                        <el-button type="primary" @click="refreshData" :loading="refreshing" icon="el-icon-refresh"> 刷新数据</el-button>
                    </div>

                    <div v-if="overviewData" class="overview-cards">
                        <div class="overview-card"><div class="number">{{ overviewData.overview.total_count }}</div><div class="label">样本总规模</div></div>
                        <div class="overview-card"><div class="number" style="color: #67C23A;">{{ overviewData.overview.avg_happiness }}</div><div class="label">平均幸福感评分</div></div>
                        <div class="overview-card"><div class="number" style="color: #E6A23C;">{{ getCountBySource('train') }}</div><div class="label">训练集样本 (Train)</div></div>
                    </div>

                    <el-tabs v-model="activeTab" class="analysis-tabs" @tab-click="handleTabClick">
                        <el-tab-pane label="训练/测试对比" name="overview"><div v-loading="loading"><div id="overview-chart" class="chart-container"></div></div></el-tab-pane>
                        <el-tab-pane label="教育梯度" name="education"><div v-loading="loading"><div id="education-chart" class="chart-container"></div></div></el-tab-pane>
                        <el-tab-pane label="经济区间" name="income"><div v-loading="loading"><div id="income-chart" class="chart-container"></div></div></el-tab-pane>
                        <el-tab-pane label="健康画像" name="health"><div v-loading="loading"><div id="health-chart" class="chart-container"></div></div></el-tab-pane>
                        <el-tab-pane label="指标关联挖掘" name="correlation"><div v-loading="loading"><div id="correlation-chart" class="chart-container"></div></div></el-tab-pane>
                        <el-tab-pane label="婚姻状况" name="marital"><div v-loading="loading"><div id="marital-chart" class="chart-container"></div></div></el-tab-pane>
                        <el-tab-pane label="综合结论" name="comprehensive">
                            <div v-if="comprehensiveData" v-loading="loading">
                                <div class="analysis-summary">
                                    <h3 style="margin: 0 0 15px 0;">挖掘分析摘要</h3>
                                    <div class="summary-grid">
                                        <div class="summary-item"><span class="summary-number">{{ comprehensiveData.analysis_summary.total_samples }}</span><span class="summary-label">挖掘总数</span></div>
                                        <div class="summary-item"><span class="summary-number">{{ comprehensiveData.analysis_summary.avg_happiness }}</span><span class="summary-label">幸福均值</span></div>
                                        <div class="summary-item"><span class="summary-number">{{ comprehensiveData.analysis_summary.key_factors.length }}</span><span class="summary-label">核心因子数</span></div>
                                    </div>
                                </div>
                                <div class="conclusions-section">
                                    <h3>智能挖掘发现</h3>
                                    <div v-for="conclusion in comprehensiveData.conclusions" :key="conclusion.category" class="conclusion-item">
                                        <div class="conclusion-category">{{ conclusion.category }}</div>
                                        <div>{{ conclusion.finding }}</div>
                                    </div>
                                </div>
                            </div>
                        </el-tab-pane>
                    </el-tabs>
                </div>
            </template>
        </admin-layout>
    </div>

    <script src="/static/js/vue.js"></script>
    <script src="/static/js/element-ui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="/static/js/axios.min.js"></script>
    <script src="/static/js/config/layout-config.js"></script>
    <script src="/static/js/components/layout.js"></script>
    <script>
        new Vue({
            el: '#app',
            data() {
                return {
                    activeMenu: 'data_analysis', activeTab: 'overview',
                    loading: false, refreshing: false,
                    overviewData: null, maritalData: null, educationData: null, incomeData: null, healthData: null, correlationData: null, comprehensiveData: null,
                    charts: {}
                }
            },
            mounted() { this.loadAllData(); },
            methods: {
                async loadAllData() {
                    this.loading = true;
                    try {
                        const [res1, res2, res3, res4, res5, res6, res7] = await Promise.all([
                            axios.get('/api/data_analysis/overview'), axios.get('/api/data_analysis/marital'),
                            axios.get('/api/data_analysis/education'), axios.get('/api/data_analysis/income'),
                            axios.get('/api/data_analysis/health'), axios.get('/api/data_analysis/correlation'),
                            axios.get('/api/data_analysis/comprehensive')
                        ]);

                        // --- [LOG] 打印 Overview 原始数据 ---
                        console.log("【调试】Overview 数据加载成功:", res1.data.data);
                        if (res1.data.data.source_stats) {
                            console.table(res1.data.data.source_stats);
                        }

                        this.overviewData = res1.data.data; this.maritalData = res2.data.data;
                        this.educationData = res3.data.data; this.incomeData = res4.data.data;
                        this.healthData = res5.data.data; this.correlationData = res6.data.data;
                        this.comprehensiveData = res7.data.data;
                        this.$nextTick(() => { this.renderCurrentChart(); });
                    } catch (e) {
                        console.error("【错误】加载数据失败:", e);
                        this.$message.error('加载失败');
                    } finally { this.loading = false; }
                },

                // 核心修复逻辑：增强数据匹配健壮性
                getCountBySource(key) {
                    if (!this.overviewData?.source_stats) {
                        console.warn(`【调试】getCountBySource('${key}'): 暂无 source_stats 数据`);
                        return 0;
                    }

                    const item = this.overviewData.source_stats.find(s =>
                        s.dataSource.toLowerCase().includes(key.toLowerCase())
                    );

                    // --- [LOG] 打印匹配过程 ---
                    if (item) {
                        console.log(`【成功】关键字 '${key}' 匹配到了数据源: '${item.dataSource}', 数量: ${item.count}`);
                    } else {
                        console.error(`【失败】关键字 '${key}' 未能在 source_stats 中找到匹配项! 当前有的项为:`,
                                      this.overviewData.source_stats.map(s => s.dataSource));
                    }

                    return item ? item.count : 0;
                },

                handleTabClick(tab) {
                    this.activeTab = tab.name;
                    this.$nextTick(() => {
                        this.renderCurrentChart();
                        Object.values(this.charts).forEach(c => c && c.resize());
                    });
                },

                renderCurrentChart() {
                    Object.values(this.charts).forEach(c => c && c.dispose());
                    this.charts = {};
                    if (this.activeTab === 'overview') this.renderOverviewChart();
                    if (this.activeTab === 'education') this.renderEducationChart();
                    if (this.activeTab === 'income') this.renderIncomeChart();
                    if (this.activeTab === 'marital') this.renderMaritalChart();
                    if (this.activeTab === 'health') this.renderHealthChart();
                    if (this.activeTab === 'correlation') this.renderCorrelationChart();
                },

                renderOverviewChart() {
                    const chart = echarts.init(document.getElementById('overview-chart'));
                    const trainNum = this.getCountBySource('train');
                    const testNum = this.getCountBySource('test');

                    chart.setOption({
                        title: { text: '数据集分布对比', left: 'center' },
                        tooltip: { trigger: 'axis' },
                        legend: { data: ['样本量', '幸福感均值'], top: 35 },
                        xAxis: { type: 'category', data: ['训练集 (Train)', '测试集 (Test)'], name: '子集' },
                        yAxis: [{ type: 'value', name: '单位: 人' }, { type: 'value', name: '评分', min: 0, max: 5, position: 'right' }],
                        series: [
                            { name: '样本量', type: 'bar', barWidth: '35%', itemStyle: { color: '#1890ff', borderRadius: [5,5,0,0] }, data: [trainNum, testNum] },
                            { name: '幸福感均值', type: 'line', yAxisIndex: 1, smooth: true, lineStyle: {width: 4, color: '#fadb14'}, symbolSize: 10, data: [this.overviewData.overview.avg_happiness, this.overviewData.overview.avg_happiness] }
                        ]
                    });
                    this.charts.overview = chart;
                },
                // ... 后面其他 render 函数代码保持完全一致 ...
                renderEducationChart() {
                    const chart = echarts.init(document.getElementById('education-chart'));
                    const mapping = {
                        '0': '未知(部分拒绝回答)', '-8': '未知(部分拒绝回答)', '拒绝回答': '未知(部分拒绝回答)',
                        '小学': '初中及以下', '初中': '初中及以下', '高中': '高中/中专', '大专': '大专', '本科': '本科', '研究生': '研究生及以上'
                    };
                    const merged = {};
                    this.educationData.education_analysis.forEach(item => {
                        const label = mapping[item.education_level] || '未知/其它';
                        merged[label] = (merged[label] || 0) + item.count;
                    });
                    chart.setOption({
                        title: { text: '受教育程度构成', left: 'center' },
                        tooltip: { trigger: 'item' },
                        series: [{
                            type: 'pie', radius: ['45%', '70%'], itemStyle: { borderRadius: 10, borderColor: '#fff', borderWidth: 2 },
                            data: Object.keys(merged).map(k => ({ name: k, value: merged[k] })).sort((a,b)=>b.value-a.value)
                        }]
                    });
                    this.charts.edu = chart;
                },

                renderIncomeChart() {
                    const chart = echarts.init(document.getElementById('income-chart'));
                    const data = this.incomeData.income_analysis;
                    chart.setOption({
                        title: { text: '个人年收入区间关联', left: 'center' },
                        tooltip: { trigger: 'axis' },
                        xAxis: { type: 'category', data: data.map(i => i.income_range), name: '个人收入区间' },
                        yAxis: [{ type: 'value', name: '样本量 (人)' }, { type: 'value', name: '评分', min: 1, max: 5, position: 'right' }],
                        series: [
                            { name: '样本', type: 'bar', barWidth: '40%', itemStyle: { color: '#40a9ff', borderRadius:[8,8,0,0] }, data: data.map(i => i.count) },
                            { name: '幸福度', type: 'line', yAxisIndex: 1, smooth: true, lineStyle: {width:4, color:'#fadb14'}, data: data.map(i => i.avg_happiness) }
                        ]
                    });
                    this.charts.income = chart;
                },

                renderCorrelationChart() {
                    const chart = echarts.init(document.getElementById('correlation-chart'));
                    const nodes = [
                        { name: '健康状况', symbolSize: 50, itemStyle: {color: '#1890ff'} },
                        { name: '个人收入', symbolSize: 45, itemStyle: {color: '#36cfc9'} },
                        { name: '社会阶层', symbolSize: 45, itemStyle: {color: '#722ed1'} },
                        { name: '公平感知', symbolSize: 40, itemStyle: {color: '#fa8c16'} },
                        { name: '心理特质', symbolSize: 35, itemStyle: {color: '#ff4d4f'} }
                    ];
                    const links = [
                        { source: '个人收入', target: '社会阶层', lineStyle: {width: 4} },
                        { source: '社会阶层', target: '公平感知', lineStyle: {width: 3} },
                        { source: '健康状况', target: '个人收入', lineStyle: {width: 2} }
                    ];
                    chart.setOption({
                        title: { text: '指标关联拓扑挖掘 (引力图)', left: 'center' },
                        series: [{
                            type: 'graph', layout: 'force', draggable: true, roam: true,
                            label: { show: true }, force: { repulsion: 400, edgeLength: 150 },
                            data: nodes, links: links, lineStyle: { opacity: 0.9, curveness: 0.2 }
                        }]
                    });
                    this.charts.corr = chart;
                },

                renderHealthChart() {
                    const chart = echarts.init(document.getElementById('health-chart'));
                    const data = this.healthData.health_analysis;
                    chart.setOption({
                        title: { text: '健康水平影响路径', left: 'center' },
                        xAxis: { type: 'category', data: data.map(i => i.health_status), name: '健康度' },
                        yAxis: { type: 'value', min: 1, max: 5, name: '分值' },
                        series: [{ type: 'line', smooth: true, areaStyle: { color: 'rgba(103,194,58,0.1)' }, data: data.map(i => i.avg_happiness) }]
                    });
                    this.charts.health = chart;
                },

                renderMaritalChart() {
                    const chart = echarts.init(document.getElementById('marital-chart'));
                    chart.setOption({
                        title: { text: '婚姻分布占比', left: 'center' },
                        series: [{ type: 'pie', radius: '60%', itemStyle: { borderRadius: 10 }, data: this.maritalData.marital_analysis.map(i => ({name: i.marital_status, value: i.count})) }]
                    });
                    this.charts.marital = chart;
                },

                async refreshData() { this.refreshing = true; try { await this.loadAllData(); } finally { this.refreshing = false; } }
            }
        });
    </script>
</body>
</html>
