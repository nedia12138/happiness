<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸福感挖掘分析系统</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <style>
        .prediction-container { padding: 25px; background: #f0f2f5; min-height: 100vh; font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "微软雅黑", Arial, sans-serif; }
        .full-width-content { width: 100%; max-width: 1100px; margin: 0 auto; }

        /* 卡片风格 */
        .group-card {
            margin-bottom: 20px; border-radius: 12px; border: none;
            box-shadow: 0 2px 12px 0 rgba(0,0,0,0.05); transition: all 0.3s;
        }
        .group-card:hover { box-shadow: 0 4px 16px 0 rgba(0,0,0,0.08); }
        .group-title { font-size: 16px; font-weight: 700; color: #303133; border-left: 5px solid #409EFF; padding-left: 12px; }

        /* 结果展示区 */
        .result-section-card {
            background: #ffffff; border-radius: 16px; padding: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            margin-top: 30px; border: 1px solid #ebeef5;
            position: relative; overflow: hidden;
        }
        /* 顶部装饰条 */
        .result-section-card::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
        }

        /* 仪表盘容器 */
        .gauge-container {
            position: relative; width: 180px; height: 180px; margin: 0 auto;
            display: flex; justify-content: center; align-items: center;
        }
        #scoreGauge { width: 100%; height: 100%; position: absolute; z-index: 10; }
        /* 呼吸光环 */
        .energy-halo {
            position: absolute; width: 100%; height: 100%; border-radius: 50%;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.3) inset;
            animation: breathe 3s ease-in-out infinite; z-index: 1;
        }
        .score-val { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); font-size: 36px; font-weight: 900; color: #1890ff; z-index: 20; text-shadow: 0 2px 10px rgba(24,144,255,0.2); }
        @keyframes breathe { 0%, 100% { opacity: 0.5; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.05); } }

        /* 算法数据块 */
        .algo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: #f8f9fa; padding: 15px; border-radius: 8px; }
        .algo-cell { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .algo-name { font-size: 12px; color: #909399; margin-bottom: 4px; }
        .algo-num { font-size: 18px; font-weight: bold; font-family: Monaco, monospace; }

        /* AI 解读 */
        .ai-note {
            margin-top: 20px; padding: 12px 16px; background: #eef7fe; border-radius: 8px;
            font-size: 13px; color: #506175; line-height: 1.6; border: 1px solid #cce5ff;
        }

        /* 炫酷图表容器 */
        .chart-container {
            margin-top: 30px; padding-top: 25px; border-top: 1px dashed #e0e0e0;
            width: 100%; height: 500px;
        }
        .chart-title { text-align: center; font-size: 18px; font-weight: 800; color: #303133; margin-bottom: 20px; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div id="app">
        <admin-layout :active-menu="'happiness_prediction'">
            <template slot="content">
                <div class="prediction-container">
                    <div class="full-width-content">

                        <el-form :model="predictionForm" label-position="top" size="medium">
                            <el-card class="group-card">
                                <div slot="header" class="group-title">人口基础画像</div>
                                <el-row :gutter="40">
                                    <el-col :span="12"><el-form-item label="1. 性别"><el-select v-model="predictionForm.gender" style="width:100%"><el-option label="男" :value="1"></el-option><el-option label="女" :value="2"></el-option></el-select></el-form-item></el-col>
                                    <el-col :span="12"><el-form-item label="2. 出生年份"><el-input-number v-model="predictionForm.birth" :min="1940" :max="2026" style="width:100%"></el-input-number></el-form-item></el-col>
                                </el-row>
                                <el-row :gutter="40">
                                    <el-col :span="12"><el-form-item label="3. 婚姻状况"><el-select v-model="predictionForm.marital" style="width:100%"><el-option label="未婚" :value="1"></el-option><el-option label="已婚" :value="3"></el-option><el-option label="离异/丧偶" :value="5"></el-option></el-select></el-form-item></el-col>
                                    <el-col :span="12"><el-form-item label="4. 最高学历"><el-select v-model="predictionForm.edu" style="width:100%"><el-option label="初中及以下" :value="3"></el-option><el-option label="高中/中专" :value="4"></el-option><el-option label="本科/大专" :value="6"></el-option><el-option label="研究生及以上" :value="8"></el-option></el-select></el-form-item></el-col>
                                </el-row>
                            </el-card>

                            <el-card class="group-card">
                                <div slot="header" class="group-title">经济与资产实力</div>
                                <el-row :gutter="40">
                                    <el-col :span="12"><el-form-item label="5. 个人年收入 (元)"><el-input-number v-model="predictionForm.income" :min="0" :step="1000" style="width:100%"></el-input-number></el-form-item></el-col>
                                    <el-col :span="12"><el-form-item label="6. 家庭年收入 (元)"><el-input-number v-model="predictionForm.family_income" :min="0" :step="1000" style="width:100%"></el-input-number></el-form-item></el-col>
                                </el-row>
                                <el-row :gutter="30">
                                    <el-col :span="8"><el-form-item label="7. 住房面积 (平)"><el-input-number v-model="predictionForm.floor_area" :min="0" style="width:100%"></el-input-number></el-form-item></el-col>
                                    <el-col :span="8"><el-form-item label="8. 私家车数量"><el-input-number v-model="predictionForm.car" :min="0" style="width:100%"></el-input-number></el-form-item></el-col>
                                    <el-col :span="8"><el-form-item label="9. 住房产权"><el-select v-model="predictionForm.house" style="width:100%"><el-option label="自有产权" :value="1"></el-option><el-option label="租赁/其他" :value="0"></el-option></el-select></el-form-item></el-col>
                                </el-row>
                            </el-card>

                            <el-card class="group-card">
                                <div slot="header" class="group-title">身心健康自评</div>
                                <el-row :gutter="40">
                                    <el-col :span="8"><el-form-item label="10. 生理健康"><el-rate v-model="predictionForm.health" show-text :texts="['极差','差','一般','好','极好']"></el-rate></el-form-item></el-col>
                                    <el-col :span="8"><el-form-item label="11. 抑郁频率"><el-rate v-model="predictionForm.depression" show-text :texts="['总是','多','有时','少','从不']"></el-rate></el-form-item></el-col>
                                    <el-col :span="8"><el-form-item label="12. 休闲放松"><el-rate v-model="predictionForm.relax"></el-rate></el-form-item></el-col>
                                </el-row>
                            </el-card>

                            <el-card class="group-card">
                                <div slot="header" class="group-title">社会阶层感知</div>
                                <el-row :gutter="40">
                                    <el-col :span="12"><el-form-item label="13. 社会公平感"><el-select v-model="predictionForm.equity" style="width:100%"><el-option label="极不公平" :value="1"></el-option><el-option label="一般" :value="3"></el-option><el-option label="非常公平" :value="5"></el-option></el-select></el-form-item></el-col>
                                    <el-col :span="12"><el-form-item label="14. 主观社会阶层"><el-slider v-model="predictionForm.class" :min="1" :max="10" show-input></el-slider></el-form-item></el-col>
                                </el-row>
                                <el-form-item label="15. 同龄人地位感知"><el-rate v-model="predictionForm.status_peer" :max="5"></el-rate></el-form-item>
                            </el-card>

                            <el-button type="primary" @click="handlePredict" :loading="loading" style="width:100%; height:55px; font-size:18px; font-weight:bold; margin-bottom:20px; border-radius:30px; box-shadow: 0 8px 20px rgba(64, 158, 255, 0.3);">启动幸福感预测</el-button>
                        </el-form>

                        <div v-if="predictionResult" id="result-section" class="result-section-card">
                            <h3 style="margin:0 0 25px 0; font-size:20px; color:#303133; text-align:center;">
                                <i class="el-icon-odometer" style="color:#1890ff; margin-right:8px;"></i> 智能挖掘结论反馈
                            </h3>

                            <el-row :gutter="40" type="flex" align="middle">
                                <el-col :span="8" style="text-align: center;">
                                    <div class="gauge-container">
                                        <div class="energy-halo"></div>
                                        <div id="scoreGauge"></div>
                                        <div class="score-val">{{predictionResult.hybrid.toFixed(2)}}</div>
                                    </div>
                                    <div style="font-weight:bold; color:#606266; margin-top:10px;">综合预测指数</div>
                                </el-col>

                                <el-col :span="16">
                                    <div class="algo-grid">
                                        <div class="algo-cell">
                                            <span class="algo-name">线性回归 (LR)</span>
                                            <span class="algo-num" style="color:#67C23A">{{predictionResult.lr.toFixed(2)}}</span>
                                        </div>
                                        <div class="algo-cell">
                                            <span class="algo-name">随机森林 (RF)</span>
                                            <span class="algo-num" style="color:#E6A23C">{{predictionResult.rf.toFixed(2)}}</span>
                                        </div>
                                    </div>
                                    <div class="ai-note">
                                        <i class="el-icon-chat-dot-round" style="font-size:16px;"></i> <strong> AI 智能解读：</strong><br>
                                        <span v-if="predictionResult.hybrid >= 3.5">
                                            您的幸福感指数<span style="color:#67C23A;font-weight:bold;">较高</span>。模型分析显示，您在心态调节和社会感知方面表现出积极的正向反馈，建议继续保持当前的社交频率与休闲习惯。
                                        </span>
                                        <span v-else>
                                            您的幸福感指数<span style="color:#E6A23C;font-weight:bold;">有待提升</span>。模型建议您优先关注下方图表中权重较高的因子（如健康、阶层认同），适当增加休闲放松频率。
                                        </span>
                                    </div>
                                </el-col>
                            </el-row>

                            <div class="chart-container">
                                <div class="chart-title">影响居民幸福感的主要因素排行top(10)</div>
                                <div id="importanceChart" style="width:100%; height:100%;"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </admin-layout>
    </div>

    <script src="/static/js/vue.js"></script>
    <script src="/static/js/element-ui.min.js"></script>
    <script src="/static/js/axios.min.js"></script>
    <script src="/static/js/echarts.min.js"></script>
    <script src="/static/js/config/layout-config.js"></script>
    <script src="/static/js/components/layout.js"></script>

    <script>
        new Vue({
            el: '#app',
            data() {
                return {
                    loading: false,
                    predictionForm: {
                        gender: 1, birth: 1995, marital: 3, edu: 6, income: 50000,
                        family_income: 100000, floor_area: 90, car: 0, house: 1,
                        health: 4, depression: 4, relax: 3, equity: 3, class: 5, status_peer: 3,
                        political: 1, hukou: 1, religion: 0, socialize: 3, learn: 2,
                        work_status: 1, family_status: 3, inc_ability: 3, trust: 3,
                        media_internet: 4, media_tv: 3, height_cm: 165, weight_jin: 130
                    },
                    predictionResult: null,
                    chartInstance: null,
                    gaugeInstance: null
                }
            },
            methods: {
                handlePredict() {
                    this.loading = true;
                    axios.post('/api/prediction/predict', this.predictionForm).then(res => {
                        if (res.data.code === 200) {
                            this.predictionResult = res.data.data;
                            this.$message.success('分析完成');
                            this.$nextTick(() => {
                                setTimeout(() => {
                                    document.getElementById('result-section').scrollIntoView({ behavior: 'smooth' });
                                    this.initGaugeChart(this.predictionResult.hybrid);
                                    this.initImportanceChart();
                                }, 300);
                            });
                        }
                    }).finally(() => { this.loading = false; });
                },
                initGaugeChart(val) {
                    const dom = document.getElementById('scoreGauge');
                    if (this.gaugeInstance) this.gaugeInstance.dispose();
                    this.gaugeInstance = echarts.init(dom);
                    this.gaugeInstance.setOption({
                        series: [{
                            type: 'gauge', min: 1, max: 5, startAngle: 210, endAngle: -30,
                            progress: { show: true, width: 12, itemStyle: { color: { type: 'linear', x: 0, y: 0, x2: 1, y2: 0, colorStops: [{ offset: 0, color: '#36cfc9' }, { offset: 1, color: '#1890ff' }] } } },
                            axisLine: { lineStyle: { width: 12, color: [[1, '#f0f2f5']] } },
                            axisTick: { show: false }, splitLine: { show: false }, axisLabel: { show: false },
                            pointer: { show: false }, detail: { show: false },
                            data: [{ value: val }]
                        }]
                    });
                },
                initImportanceChart() {
                    const chartDom = document.getElementById('importanceChart');
                    if (this.chartInstance) this.chartInstance.dispose();
                    this.chartInstance = echarts.init(chartDom);

                    axios.get('/api/prediction/model_info').then(res => {
                        if (res.data.code === 200) {
                            const rawData = res.data.data.feature_importance || res.data.data.importances || [];
                            const top10Data = rawData.slice(0, 10).reverse();

                            this.chartInstance.setOption({
                                // 酷炫的提示框
                                tooltip: {
                                    trigger: 'axis', axisPointer: { type: 'none' },
                                    backgroundColor: 'rgba(50, 50, 50, 0.9)',
                                    borderColor: '#00f2fe', borderWidth: 1,
                                    textStyle: { color: '#fff' },
                                    formatter: '{b} : <span style="color:#00f2fe;font-weight:bold">{c}%</span>'
                                },
                                grid: { top: 20, bottom: 20, left: '22%', right: '12%', containLabel: false },
                                xAxis: { type: 'value', show: false },
                                yAxis: {
                                    type: 'category',
                                    data: top10Data.map(i => i.name || i.feature),
                                    axisLine: { show: false }, axisTick: { show: false },
                                    axisLabel: {
                                        fontWeight: 'bold', fontSize: 13, color: '#506175',
                                        formatter: function(value, index) {
                                            // 前3名加个皇冠图标（用emoji代替）
                                            const icons = ['🥇', '🥈', '🥉'];
                                            const i = top10Data.length - 1 - index;
                                            return (i < 3 ? icons[i] + ' ' : '') + value;
                                        }
                                    }
                                },
                                series: [{
                                    type: 'bar',
                                    data: top10Data.map(i => i.value || i.importance),
                                    barWidth: 18,
                                    showBackground: true,
                                    backgroundStyle: { color: '#f0f2f5', borderRadius: 10 },
                                    itemStyle: {
                                        borderRadius: 10,
                                        // 极光渐变 + 投影光晕
                                        color: new echarts.graphic.LinearGradient(1, 0, 0, 0, [
                                            { offset: 0, color: '#00c6fb' },
                                            { offset: 1, color: '#005bea' }
                                        ]),
                                        shadowBlur: 10,
                                        shadowColor: 'rgba(0, 91, 234, 0.3)'
                                    },
                                    label: {
                                        show: true, position: 'right', formatter: '{c}%',
                                        fontSize: 12, fontWeight: 'bold', color: '#005bea',
                                        offset: [5, 0]
                                    },
                                    // 弹性入场动画
                                    animationDuration: 1500,
                                    animationEasing: 'elasticOut'
                                }]
                            });
                            this.chartInstance.resize();
                        }
                    });
                }
            }
        });
    </script>
</body>
</html>
